[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "align-structure-recognition-parity"
version = "0.1.0"
description = "Portable ALIGN structure-recognition subset with template-matching parity"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ALIGN structure recognition package extractor" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "pydantic>=1.9.2,<2.0",
  "networkx",
  "pyyaml",
  "z3-solver",
  "flatdict",
  "more-itertools",
  "colorlog",
]

[project.scripts]
align-recognize-structure = "recognize_one_netlist:main"

[tool.setuptools]
py-modules = ["recognize_one_netlist"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["align*", "pdks*"]
exclude = ["examples*", "dist*", "build*"]

[tool.setuptools.package-data]
"align.config" = ["*.sp", "*.ini"]
"pdks.FinFET14nm_Mock_PDK" = ["models.sp", "README.md"]
